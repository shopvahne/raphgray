<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>RaphGray — Coming Soon</title>
  <meta name="description" content="RaphGray official website. Something great is coming soon." />
  <link rel="icon" href="https://fav.farm/⚡" />

  <style>
    :root {
      --bg: #0b0b0f;
      --card: #12121a;
      --text: #f5f5f7;
      --muted: #a1a1aa;
      --accent: #7c7cff;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(1200px 600px at 20% 0%, #141428 0%, transparent 60%),
                  radial-gradient(800px 500px at 80% 100%, #1a1a33 0%, transparent 60%),
                  var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 48px 40px;
      max-width: 520px;
      width: calc(100% - 32px);
      text-align: center;
      box-shadow: 0 30px 80px rgba(0,0,0,0.45);
      backdrop-filter: blur(8px);
    }

    .logo {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    .logo span {
      color: var(--accent);
    }

    h1 {
      font-size: 28px;
      margin: 16px 0 12px;
    }

    p {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
      margin: 0 0 28px;
    }

    .divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      margin: 28px 0;
    }

    .footer {
      font-size: 13px;
      color: var(--muted);
    }

    .footer a {
      color: var(--accent);
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 480px) {
      .card {
        padding: 36px 24px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">Raph<span>Gray</span></div>
    <h1>Website Coming Soon</h1>
    <p>
      We’re building something clean, fast, and modern.
      <br />
      Check back soon — raphgray.com is on the way.
    </p>

    <div class="divider"></div>

    <div class="footer">
      © <span id="year"></span> RaphGray · All rights reserved
    </div>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
